services:
  student-directory:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      PORT: 3000
      STUDENT_DATA_DIR: /app/data
    volumes:
      - student_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  student_data:
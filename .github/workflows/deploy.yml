name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run lint && npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/student_deploy_key
          chmod 600 ~/.ssh/student_deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_USER" && test -n "$SERVER_APP_DIR"
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='data' \
            --exclude='.env' --exclude='.env.*' \
            -e 'ssh -i ~/.ssh/student_deploy_key -o IdentitiesOnly=yes' \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_APP_DIR/"

      - name: Build and restart on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR }}
        run: |
          printf -v remote_command 'cd %q && docker compose up -d --build --remove-orphans' "$SERVER_APP_DIR"
          ssh -i ~/.ssh/student_deploy_key -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "$remote_command"